<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" role="img">
<title>Cyberpunk Divider</title>
<style>
@keyframes laser-pulse {
  0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px #00F0FF); }
  50% { opacity: 1; filter: drop-shadow(0 0 8px #00F0FF); }
}
@keyframes scan-move {
  0% { transform: translateX(-100px); }
  100% { transform: translateX(900px); }
}
.laser { animation: laser-pulse 2.5s ease-in-out infinite; }
.scanner { animation: scan-move 4s linear infinite; }
</style>
<defs>
  <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
    <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#FF0055" stop-opacity="1"/>
    <stop offset="75%" stop-color="#00F0FF" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="900" height="40" fill="#080C14" rx="4"/>
<!-- Tech corner markers -->
<path d="M 10 12 L 10 8 L 25 8" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.7"/>
<path d="M 890 12 L 890 8 L 875 8" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.7"/>
<path d="M 10 28 L 10 32 L 25 32" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.7"/>
<path d="M 890 28 L 890 32 L 875 32" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.7"/>

<!-- Grid lines -->
<line x1="30" y1="20" x2="380" y2="20" stroke="url(#div-grad)" stroke-width="2" class="laser"/>
<line x1="520" y1="20" x2="870" y2="20" stroke="url(#div-grad)" stroke-width="2" class="laser"/>

<!-- Circuit dots -->
<circle cx="395" cy="20" r="3" fill="#00F0FF"/>
<circle cx="505" cy="20" r="3" fill="#00F0FF"/>
<line x1="400" y1="20" x2="415" y2="20" stroke="#00F0FF" stroke-width="1.5"/>
<line x1="485" y1="20" x2="500" y2="20" stroke="#00F0FF" stroke-width="1.5"/>

<!-- Center HUD Diamond -->
<polygon points="450,11 465,20 450,29 435,20" fill="#080C14" stroke="#FF0055" stroke-width="2"/>
<polygon points="450,15 457,20 450,25 443,20" fill="#00F0FF"/>

<!-- Center Badge Text -->
<text x="450" y="23" font-family="'Consolas', 'Courier New', monospace" font-size="7" font-weight="900" fill="#000000" text-anchor="middle">SYS</text>
</svg>
