<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img">
<title>Stay Curious. Keep Architecting.</title>
<style>
@keyframes glow-footer {
  0%, 100% { filter: drop-shadow(0 0 4px #00F0FF); }
  50% { filter: drop-shadow(0 0 12px #FF0055); }
}
@keyframes blink-cursor-f {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.glow-f { animation: glow-footer 4s infinite; }
.blinker-f { animation: blink-cursor-f 1s infinite; }
</style>
<defs>
  <pattern id="grid-footer" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.08"/>
  </pattern>
  <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#04060A"/>
    <stop offset="50%" stop-color="#080D1A"/>
    <stop offset="100%" stop-color="#060912"/>
  </linearGradient>
  <linearGradient id="neon-line" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00F0FF"/>
    <stop offset="50%" stop-color="#7928CA"/>
    <stop offset="100%" stop-color="#FF0055"/>
  </linearGradient>
</defs>

<rect width="1200" height="260" fill="url(#footer-bg)"/>
<rect width="1200" height="260" fill="url(#grid-footer)"/>

<!-- Tech Borders & Cut Corners -->
<polygon points="
  30,15 1170,15 1185,30 1185,230 1170,245 30,245 15,230 15,30
" fill="none" stroke="#16233B" stroke-width="2"/>

<!-- Corner Reticles -->
<path d="M 15 45 L 15 30 L 30 15 L 50 15" fill="none" stroke="#00F0FF" stroke-width="3"/>
<path d="M 1150 15 L 1170 15 L 1185 30 L 1185 45" fill="none" stroke="#00F0FF" stroke-width="3"/>
<path d="M 15 215 L 15 230 L 30 245 L 50 245" fill="none" stroke="#FF0055" stroke-width="3"/>
<path d="M 1150 245 L 1170 245 L 1185 230 L 1185 215" fill="none" stroke="#00F0FF" stroke-width="3"/>

<!-- Top Telemetry Line -->
<line x1="30" y1="35" x2="1170" y2="35" stroke="url(#neon-line)" stroke-width="1.5" opacity="0.6"/>

<!-- Main Headline -->
<text x="60" y="115" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="2">
  STAY CURIOUS. KEEP ARCHITECTING.
</text>
<text x="60" y="115" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#00F0FF" letter-spacing="2" opacity="0.2" class="glow-f">
  STAY CURIOUS. KEEP ARCHITECTING.
</text>

<!-- Subtitle / Terminal Command -->
<text x="60" y="165" font-family="'Consolas', 'Courier New', monospace" font-size="20" font-weight="700" fill="#00FFCC" letter-spacing="1">
  &gt; terminal.session.suspend() // SYSTEM_STANDBY : CONTINUOUS_EXPEDITION
</text>
<rect x="790" y="146" width="10" height="22" fill="#FF0055" class="blinker-f"/>

<text x="60" y="205" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="600" fill="#8B949E" letter-spacing="1">
  CODE_BASE // REACT_18 // ALGORITHMIC_SYSTEMS // AAHIL-J CORP. ALL TRANSMISSIONS LOGGED.
</text>

<!-- Right Side Cyber Badge -->
<g transform="translate(930, 80)">
  <polygon points="0,0 200,0 215,15 215,75 200,90 0,90" fill="#0E1728" stroke="#00F0FF" stroke-width="2"/>
  <rect x="0" y="0" width="200" height="24" fill="#00F0FF" fill-opacity="0.15"/>
  <text x="12" y="17" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="900" fill="#00F0FF">[ TERMINAL STATUS ]</text>
  
  <circle cx="20" cy="50" r="5" fill="#00FFCC"/>
  <text x="34" y="55" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="800" fill="#FFFFFF">ACTIVE 24/7</text>
  <text x="15" y="77" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="600" fill="#58A6FF">NODE: GITHUB/AAHIL-J</text>
</g>
</svg>
