<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img">
<title>Cyber Telemetry Ticker 2</title>
<style>
@keyframes scroll-left-2 {
  0% { transform: translateX(0); }
  100% { transform: translateX(-1500px); }
}
.marquee2 {
  animation: scroll-left-2 22s linear infinite;
  white-space: nowrap;
}
</style>
<defs>
  <linearGradient id="edge-fade-left2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#080C14" stop-opacity="1"/>
    <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edge-fade-right2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#080C14" stop-opacity="0"/>
    <stop offset="100%" stop-color="#080C14" stop-opacity="1"/>
  </linearGradient>
</defs>
<rect width="900" height="44" fill="#080C14" stroke="#16233B" stroke-width="1.5" rx="4"/>
<line x1="0" y1="2" x2="900" y2="2" stroke="#FF0055" stroke-width="1.5" stroke-opacity="0.6"/>
<line x1="0" y1="42" x2="900" y2="42" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>

<!-- Left HUD Tag -->
<rect x="6" y="8" width="100" height="28" fill="#FF0055" fill-opacity="0.15" stroke="#FF0055" stroke-width="1" rx="2"/>
<circle cx="18" cy="22" r="3.5" fill="#FF0055"/>
<text x="28" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="900" fill="#FF0055" letter-spacing="1">TELEMETRY</text>

<!-- Scrolling Marquee Viewport -->
<g transform="translate(120, 0)">
  <clipPath id="ticker-clip2">
    <rect x="0" y="0" width="770" height="44"/>
  </clipPath>
  <g clip-path="url(#ticker-clip2)">
    <g class="marquee2">
      <text x="0" y="27" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="700" fill="#A5B4FC" letter-spacing="1">
        &gt;&gt;&gt; <tspan fill="#00F0FF">[TRANSMISSION]:</tspan> APPRECIATE YOUR VISIT TO AAHIL'S TERMINAL &gt;&gt;&gt; <tspan fill="#FF0055">[PHILOSOPHY]:</tspan> STAY CURIOUS. KEEP BUILDING. EVOLVE DAILY. &gt;&gt;&gt; <tspan fill="#00FFCC">[STATUS]:</tspan> REPOSITORIES OPEN FOR INSPECTION &gt;&gt;&gt; <tspan fill="#FFE600">[PING]:</tspan> ALWAYS READY FOR NEXT-TIER CHALLENGES &gt;&gt;&gt;
      </text>
      <!-- Duplicate for seamless scroll -->
      <text x="1500" y="27" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="700" fill="#A5B4FC" letter-spacing="1">
        &gt;&gt;&gt; <tspan fill="#00F0FF">[TRANSMISSION]:</tspan> APPRECIATE YOUR VISIT TO AAHIL'S TERMINAL &gt;&gt;&gt; <tspan fill="#FF0055">[PHILOSOPHY]:</tspan> STAY CURIOUS. KEEP BUILDING. EVOLVE DAILY. &gt;&gt;&gt; <tspan fill="#00FFCC">[STATUS]:</tspan> REPOSITORIES OPEN FOR INSPECTION &gt;&gt;&gt; <tspan fill="#FFE600">[PING]:</tspan> ALWAYS READY FOR NEXT-TIER CHALLENGES &gt;&gt;&gt;
      </text>
    </g>
  </g>
  <!-- Edge Gradients for Smooth In/Out Fading -->
  <rect x="0" y="0" width="40" height="44" fill="url(#edge-fade-left2)"/>
  <rect x="730" y="0" width="40" height="44" fill="url(#edge-fade-right2)"/>
</g>
</svg>
