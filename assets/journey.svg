<svg xmlns="http://www.w3.org/2000/svg" width="991" height="480" viewBox="0 0 991 480" role="img">
<title>Learning Expedition - Mission Roadmap</title>
<style>
@keyframes pulse-cyan {
  0%, 100% { filter: drop-shadow(0 0 2px #00FFCC); }
  50% { filter: drop-shadow(0 0 6px #00FFCC); }
}
@keyframes pulse-yellow {
  0%, 100% { filter: drop-shadow(0 0 2px #FFE600); }
  50% { filter: drop-shadow(0 0 6px #FFE600); }
}
.active-pulse { animation: pulse-yellow 2s infinite; }
.comp-pulse { animation: pulse-cyan 3s infinite; }
</style>
<defs>
  <pattern id="journey-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.08"/>
  </pattern>
  <linearGradient id="journey-bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#080C14"/>
    <stop offset="50%" stop-color="#0B1322"/>
    <stop offset="100%" stop-color="#070A12"/>
  </linearGradient>
  <linearGradient id="prog-bar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FFCC"/>
    <stop offset="50%" stop-color="#00F0FF"/>
    <stop offset="100%" stop-color="#7928CA"/>
  </linearGradient>
</defs>

<rect width="991" height="480" fill="#050810"/>
<rect x="10" y="10" width="971" height="460" fill="url(#journey-bg)" stroke="#16233B" stroke-width="2" rx="6"/>
<rect x="10" y="10" width="971" height="460" fill="url(#journey-grid)" rx="6"/>

<!-- Corner Accents -->
<path d="M 10 35 L 10 10 L 35 10" fill="none" stroke="#A5B4FC" stroke-width="3"/>
<path d="M 981 35 L 981 10 L 956 10" fill="none" stroke="#A5B4FC" stroke-width="3"/>
<path d="M 10 445 L 10 470 L 35 470" fill="none" stroke="#00FFCC" stroke-width="3"/>
