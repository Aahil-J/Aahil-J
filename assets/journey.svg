h="4"/><text x="314.0" y="66.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Published a project on GitHub: CAF</text></g></g><g class="fx bob" style="animation-delay:-0.25s"><rect x="49" y="105" width="44" height="44" fill="#000000"/><rect x="44" y="100" width="44" height="44" fill="#2F5BFF" stroke="#000000" stroke-width="4"/><polyline points="55,123 63,131 77,113" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/></g><g transform="rotate(0 354.0 122.0)"><g class="fx bob" style="animation-delay:-0.25s"><rect x="109" y="105" width="500" height="44" fill="#000000"/><rect x="104" y="100" width="500" height="44" fill="#DBE4FF" stroke="#000000" stroke-width="4"/><text x="354.0" y="122.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Wrote tests with Jest and Testing Library</text></g></g><g class="fx bob" style="animation-delay:-0.5s"><rect x="49" y="161" width="44" height="44" fill="#000000"/><rect x="44" y="156" width="44" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/></g><g transform="rotate(0 337.0 178.0)"><g class="fx bob" style="animation-delay:-0.5s"><rect x="109" y="161" width="466" height="44" fill="#000000"/><rect x="104" y="156" width="466" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><text x="337.0" y="178.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Strengthen my programming fundamentals</text></g></g><g class="fx bob" style="animation-delay:-0.75s"><rect x="49" y="217" width="44" height="44" fill="#000000"/><rect x="44" y="212" width="44" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/></g><g transform="rotate(0 342.5 234.0)"><g class="fx bob" style="animation-delay:-0.75s"><rect x="109" y="217" width="477" height="44" fill="#000000"/><rect x="104" y="212" width="477" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><text x="342.5" y="234.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Practice data structures and algorithms</text></g></g><g class="fx bob" style="animation-delay:-1.0s"><rect x="49" y="273" width="44" height="44" fill="#000000"/><rect x="44" y="268" width="44" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/></g><g transform="rotate(0 296.5 290.0)"><g class="fx bob" style="animation-delay:-1.0s"><rect x="109" y="273" width="385" height="44" fill="#000000"/><rect x="104" y="268" width="385" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><text x="296.5" y="290.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Build and publish more projects</text></g></g><g class="fx bob" style="animation-delay:-1.25s"><rect x="49" y="329" width="44" height="44" fill="#000000"/><rect x="44" y="324" width="44" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/></g><g transform="rotate(0 348.5 346.0)"><g class="fx bob" style="animation-delay:-1.25s"><rect x="109" y="329" width="489" height="44" fill="#000000"/><rect x="104" y="324" width="489" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><text x="348.5" y="346.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Learn to collaborate with Git and GitHub</text></g></g><g class="fx bob" style="animation-delay:-1.5s"><rect x="49" y="385" width="44" height="44" fill="#000000"/><rect x="44" y="380" width="44" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/></g><g transform="rotate(0 325.5 402.0)"><g class="fx bob" style="animation-delay:-1.5s"><rect x="109" y="385" width="443" height="44" fill="#000000"/><rect x="104" y="380" width="443" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><text x="325.5" y="402.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Contribute to an open-source project</text></g></g><g transform="rotate(4 816.0 238.0)"><g class="fx wig2" style="animation-delay:-0.8s"><rect x="741" y="215" width="160" height="56" fill="#000000"/><rect x="736" y="210" width="160" height="56" fill="#2F5BFF" stroke="#000000" stroke-width="4"/><text x="816.0" y="238.0" dy=".35em" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">2 / 7 done</text></g></g><polygon class="fx spin" points="947.0,16.0 951.9,24.8 961.1,20.6 959.9,30.6 969.8,32.6 963.0,40.0 969.8,47.4 959.9,49.4 961.1,59.4 951.9,55.2 947.0,64.0 942.1,55.2 932.9,59.4 934.1,49.4 924.2,47.4 931.0,40.0 924.2,32.6 934.1,30.6 932.9,20.6 942.1,24.8" fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
