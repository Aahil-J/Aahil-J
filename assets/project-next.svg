<svg xmlns="http://www.w3.org/2000/svg" width="500" height="290" viewBox="0 0 500 290" role="img">
<title>Project Next - Incubating Build</title>
<style>
@keyframes glow-card2 {
  0%, 100% { stroke: #FF0055; filter: drop-shadow(0 0 4px #FF005588); }
  50% { stroke: #00F0FF; filter: drop-shadow(0 0 8px #00F0FF88); }
}
@keyframes spin-reticle2 { to { transform: rotate(-360deg); } }
.card-border2 { animation: glow-card2 5s infinite; }
.spin-gear2 { animation: spin-reticle2 14s linear infinite; transform-origin: 455px 42px; }
</style>
<defs>
  <pattern id="card-grid2" width="15" height="15" patternUnits="userSpaceOnUse">
    <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#FF0055" stroke-width="0.5" stroke-opacity="0.08"/>
  </pattern>
  <linearGradient id="next-bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#070C16"/>
    <stop offset="60%" stop-color="#140D1D"/>
    <stop offset="100%" stop-color="#080E1C"/>
  </linearGradient>
</defs>

<!-- Card Body with Angled Cut Corner -->
<polygon points="
  20,10 480,10 495,25 495,270 480,285 20,285 5,270 5,25
" fill="url(#next-bg)" stroke="#381B34" stroke-width="2"/>
<polygon points="
  20,10 480,10 495,25 495,270 480,285 20,285 5,270 5,25
" fill="url(#card-grid2)"/>

<!-- Corner Reticles -->
<path d="M 5 45 L 5 25 L 20 10 L 45 10" fill="none" stroke="#FF0055" stroke-width="2.5"/>
<path d="M 460 10 L 480 10 L 495 25 L 495 45" fill="none" stroke="#FF0055" stroke-width="2.5"/>
<path d="M 5 250 L 5 270 L 20 285 L 45 285" fill="none" stroke="#FF0055" stroke-width="2.5"/>
<path d="M 460 285 L 480 285 L 495 270 L 495 250" fill="none" stroke="#FF0055" stroke-width="2.5"/>

<!-- Top Status HUD Bar -->
<rect x="25" y="24" width="245" height="24" fill="#FF0055" fill-opacity="0.12" stroke="#FF0055" stroke-width="1" rx="3"/>
<circle cx="37" cy="36" r="3.5" fill="#FFE600"/>
<text x="47" y="40" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="900" fill="#FF0055" letter-spacing="1">PROJECT // 02 :: IN_PROGRESS</text>

<!-- Animated Radar in Top-Right -->
<g class="spin-gear2">
  <circle cx="455" cy="42" r="16" fill="none" stroke="#FF0055" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <circle cx="455" cy="42" r="10" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
</g>
<circle cx="455" cy="42" r="3" fill="#FFE600"/>

<!-- Project Title -->
<text x="25" y="85" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="1">PROJECT_NEXT</text>
<text x="25" y="112" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#FF0055" letter-spacing="1">[CLASSIFIED BUILD]</text>

<!-- Tech Badges Pill Row -->
<g transform="translate(25, 126)">
  <rect x="0" y="0" width="105" height="20" fill="#260D1E" stroke="#FF0055" stroke-width="1" rx="2"/>
  <text x="52" y="14" font-family="'Consolas', 'Courier New', monospace" font-size="9" font-weight="800" fill="#FF0055" text-anchor="middle">NEXT-GEN UI</text>

  <rect x="112" y="0" width="85" height="20" fill="#260D1E" stroke="#00F0FF" stroke-width="1" rx="2"/>
  <text x="154" y="14" font-family="'Consolas', 'Courier New', monospace" font-size="9" font-weight="800" fill="#00F0FF" text-anchor="middle">STATE CORE</text>

  <rect x="204" y="0" width="75" height="20" fill="#260D1E" stroke="#A5B4FC" stroke-width="1" rx="2"/>
  <text x="241" y="14" font-family="'Consolas', 'Courier New', monospace" font-size="9" font-weight="800" fill="#A5B4FC" text-anchor="middle">MODULAR</text>
</g>

<!-- Description -->
<text x="25" y="172" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="600" fill="#C9D1D9">
  &gt; Classified upcoming web application exploring performant
</text>
<text x="25" y="192" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="600" fill="#C9D1D9">
  &gt; architectures, data flows, and interactive UX paradigms.
</text>
<text x="25" y="212" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="500" fill="#8B949E">
  Actively committing prototypes to GitHub repository registry.
</text>

<!-- Action CTA Button -->
<g transform="translate(25, 236)">
  <polygon points="0,0 170,0 182,12 182,34 170,34 0,34" fill="#FF0055" fill-opacity="0.15" stroke="#FF0055" stroke-width="1.5"/>
  <text x="15" y="22" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="900" fill="#FF0055" letter-spacing="1">ALL REPOSITORIES &gt;_</text>
</g>

<text x="475" y="258" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#FFE600" text-anchor="end">SYS_BUILD: COMING_SOON</text>
</svg>
