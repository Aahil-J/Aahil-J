<svg xmlns="http://www.w3.org/2000/svg" width="991" height="340" viewBox="0 0 991 340" role="img">
<title>Tech Matrix - Cybernetic Stack</title>
<style>
@keyframes glow-chip {
  0%, 100% { filter: drop-shadow(0 0 2px #00F0FF); }
  50% { filter: drop-shadow(0 0 6px #00F0FF); }
}
.chip { transition: all 0.3s ease; }
</style>
<defs>
  <pattern id="stack-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.08"/>
  </pattern>
  <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#080C14"/>
    <stop offset="50%" stop-color="#0B1322"/>
    <stop offset="100%" stop-color="#070A12"/>
  </linearGradient>
</defs>

<rect width="991" height="340" fill="#050810"/>
<rect x="10" y="10" width="971" height="320" fill="url(#stack-bg)" stroke="#16233B" stroke-width="2" rx="6"/>
<rect x="10" y="10" width="971" height="320" fill="url(#stack-grid)" rx="6"/>

<!-- Corner Accents -->
<path d="M 10 35 L 10 10 L 35 10" fill="none" stroke="#00FFCC" stroke-width="3"/>
<path d="M 981 35 L 981 10 L 956 10" fill="none" stroke="#00FFCC" stroke-width="3"/>
<path d="M 10 305 L 10 330 L 35 330" fill="none" stroke="#00FFCC" stroke-width="3"/>
<path d="M 981 305 L 981 330 L 956 330" fill="none" stroke="#00FFCC" stroke-width="3"/>

<!-- Top Status Header -->
<rect x="30" y="24" width="931" height="30" fill="#00FFCC" fill-opacity="0.08" stroke="#00FFCC" stroke-width="1"/>
<text x="45" y="44" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="900" fill="#00FFCC" letter-spacing="1.5">// ARSENAL_MATRIX :: LOADED_MODULES &amp; TECH_COMPONENTS</text>
<text x="945" y="44" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#00F0FF" text-anchor="end">● NODES_ACTIVE: 12/12</text>

<!-- Category 1: LANGUAGES -->
<g transform="translate(30, 70)">
  <!-- Category Label -->
  <rect x="0" y="0" width="160" height="42" fill="#0E1728" stroke="#00F0FF" stroke-width="1.5" rx="3"/>
  <text x="14" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="900" fill="#00F0FF">LANGUAGES</text>
  
  <!-- Chips -->
  <g transform="translate(175, 0)">
    <rect x="0" y="0" width="135" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#00F0FF"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">HTML5</text>
  </g>
  <g transform="translate(325, 0)">
    <rect x="0" y="0" width="135" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#00F0FF"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">CSS3</text>
  </g>
  <g transform="translate(475, 0)">
    <rect x="0" y="0" width="220" height="42" fill="#0A111C" stroke="#FFE600" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#FFE600"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">JAVASCRIPT ES6+</text>
  </g>
</g>

<!-- Category 2: FRAMEWORKS -->
<g transform="translate(30, 130)">
  <rect x="0" y="0" width="160" height="42" fill="#0E1728" stroke="#00FFCC" stroke-width="1.5" rx="3"/>
  <text x="14" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="900" fill="#00FFCC">FRAMEWORKS</text>

  <g transform="translate(175, 0)">
    <rect x="0" y="0" width="150" height="42" fill="#0A111C" stroke="#00F0FF" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#00F0FF"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">REACT 18</text>
  </g>
  <g transform="translate(340, 0)">
    <rect x="0" y="0" width="230" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#00FFCC"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">CREATE REACT APP</text>
  </g>
  <g transform="translate(585, 0)">
    <rect x="0" y="0" width="180" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#00FFCC"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">REACT HOOKS</text>
  </g>
</g>

<!-- Category 3: TOOLS & TESTING -->
<g transform="translate(30, 190)">
  <rect x="0" y="0" width="160" height="42" fill="#0E1728" stroke="#FF0055" stroke-width="1.5" rx="3"/>
  <text x="14" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="900" fill="#FF0055">TOOLS / TEST</text>

  <g transform="translate(175, 0)">
    <rect x="0" y="0" width="95" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#F05032"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">GIT</text>
  </g>
  <g transform="translate(285, 0)">
    <rect x="0" y="0" width="125" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#FFFFFF"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">GITHUB</text>
  </g>
  <g transform="translate(425, 0)">
    <rect x="0" y="0" width="105" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#CB3837"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">NPM</text>
  </g>
  <g transform="translate(545, 0)">
    <rect x="0" y="0" width="105" height="42" fill="#0A111C" stroke="#FF0055" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#C21325"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">JEST</text>
  </g>
  <g transform="translate(665, 0)">
    <rect x="0" y="0" width="220" height="42" fill="#0A111C" stroke="#FF0055" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#FF0055"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">TESTING LIBRARY</text>
  </g>
</g>

<!-- Category 4: DOMAINS -->
<g transform="translate(30, 250)">
  <rect x="0" y="0" width="160" height="42" fill="#0E1728" stroke="#A5B4FC" stroke-width="1.5" rx="3"/>
  <text x="14" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="900" fill="#A5B4FC">DOMAINS</text>

  <g transform="translate(175, 0)">
    <rect x="0" y="0" width="235" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#A5B4FC"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">FRONT-END SYSTEMS</text>
  </g>
  <g transform="translate(425, 0)">
    <rect x="0" y="0" width="200" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#A5B4FC"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">RESPONSIVE UI/UX</text>
  </g>
  <g transform="translate(640, 0)">
    <rect x="0" y="0" width="230" height="42" fill="#0A111C" stroke="#1F3354" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="21" r="4" fill="#00FFCC"/>
    <text x="30" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">ALGORITHMIC LOGIC</text>
  </g>
</g>
</svg>
