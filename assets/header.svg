<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img">
<title>Aahil - Front-End Architect</title>
<style>
@keyframes laser-sweep {
  0% { transform: translateY(-420px); opacity: 0; }
  50% { opacity: 0.7; }
  100% { transform: translateY(420px); opacity: 0; }
}
@keyframes neon-flicker {
  0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
    filter: drop-shadow(0 0 8px #00F0FF) drop-shadow(0 0 20px #00F0FF88);
  }
  20%, 24%, 55% { filter: none; }
}
@keyframes pulse-ring {
  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 10px #FF0055); }
  100% { transform: scale(0.95); opacity: 0.8; }
}
@keyframes spin-slow {
  to { transform: rotate(360deg); }
}
@keyframes spin-reverse {
  to { transform: rotate(-360deg); }
}
@keyframes blink-cursor {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.laser { animation: laser-sweep 6s linear infinite; }
.neon-title { animation: neon-flicker 6s infinite; }
.pulse { animation: pulse-ring 3s ease-in-out infinite; transform-origin: center; }
.spin { animation: spin-slow 16s linear infinite; transform-origin: 1090px 85px; }
.spin-rev { animation: spin-reverse 10s linear infinite; transform-origin: 1090px 85px; }
.cursor { animation: blink-cursor 1s steps(1) infinite; }
</style>
<defs>
  <!-- Background Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F0FF" stroke-width="0.7" stroke-opacity="0.08"/>
  </pattern>
  <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.8" fill="#58A6FF" fill-opacity="0.18"/>
  </pattern>

  <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#04060A"/>
    <stop offset="40%" stop-color="#080D18"/>
    <stop offset="100%" stop-color="#0A1122"/>
  </linearGradient>

  <linearGradient id="cyan-pink" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00F0FF"/>
    <stop offset="50%" stop-color="#7928CA"/>
    <stop offset="100%" stop-color="#FF0055"/>
  </linearGradient>

  <linearGradient id="laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Outer Canvas -->
<rect width="1200" height="420" fill="url(#bg-grad)"/>
<rect width="1200" height="420" fill="url(#grid)"/>
<rect width="1200" height="420" fill="url(#dots)"/>

<!-- Laser Scanning Sweep Line -->
<g class="laser">
  <rect x="0" y="200" width="1200" height="8" fill="url(#laser-beam)"/>
  <line x1="0" y1="204" x2="1200" y2="204" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>
</g>

<!-- Outer HUD Tech Border with Cut Corners -->
<polygon points="
  40,15 1160,15 1185,40 1185,380 1160,405 40,405 15,380 15,40
" fill="none" stroke="#16233B" stroke-width="2"/>

<!-- Glowing Corner Brackets -->
<path d="M 15 60 L 15 40 L 40 15 L 70 15" fill="none" stroke="#00F0FF" stroke-width="3.5"/>
<path d="M 1130 15 L 1160 15 L 1185 40 L 1185 70" fill="none" stroke="#00F0FF" stroke-width="3.5"/>
<path d="M 15 360 L 15 380 L 40 405 L 70 405" fill="none" stroke="#FF0055" stroke-width="3.5"/>
<path d="M 1130 405 L 1160 405 L 1185 380 L 1185 350" fill="none" stroke="#00F0FF" stroke-width="3.5"/>

<!-- Top HUD Status Bar -->
<rect x="40" y="25" width="1120" height="32" fill="#0D1626" fill-opacity="0.75" stroke="#1F3354" stroke-width="1" rx="4"/>
<circle cx="62" cy="41" r="5" fill="#00FFCC"/>
<text x="76" y="45" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="900" fill="#00FFCC" letter-spacing="1">SYSTEM_ONLINE</text>

<text x="240" y="45" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600" fill="#58A6FF" letter-spacing="1">KERNEL: REACT_V18</text>
<text x="430" y="45" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600" fill="#58A6FF" letter-spacing="1">NODE: CHENNAI_IND</text>
<text x="630" y="45" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600" fill="#58A6FF" letter-spacing="1">ACCESS: PROTOCOL_GRANTED</text>
<text x="1135" y="45" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="900" fill="#FF0055" text-anchor="end" letter-spacing="1">SECURITY: LEVEL_05 [MAX]</text>

<!-- Main Title Left Block -->
<!-- Cyber Chromatic Offset Title -->
<g class="neon-title">
  <!-- Magenta shadow -->
  <text x="76" y="196" font-family="'Orbitron', 'Rajdhani', 'Arial Black', sans-serif" font-size="115" font-weight="900" fill="#FF0055" letter-spacing="6" opacity="0.8">AAHIL</text>
  <!-- Cyan shadow -->
  <text x="68" y="190" font-family="'Orbitron', 'Rajdhani', 'Arial Black', sans-serif" font-size="115" font-weight="900" fill="#00F0FF" letter-spacing="6" opacity="0.8">AAHIL</text>
  <!-- Foreground Crisp Text -->
  <text x="72" y="192" font-family="'Orbitron', 'Rajdhani', 'Arial Black', sans-serif" font-size="115" font-weight="900" fill="#FFFFFF" letter-spacing="6">AAHIL</text>
</g>

<!-- Subtitle HUD text -->
<g transform="translate(74, 235)">
  <rect x="0" y="0" width="670" height="34" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1.5"/>
  <polygon points="0,0 8,0 0,8" fill="#00F0FF"/>
  <polygon points="670,34 662,34 670,26" fill="#00F0FF"/>
  <text x="16" y="22" font-family="'Consolas', 'Courier New', monospace" font-size="16" font-weight="800" fill="#00F0FF" letter-spacing="2">// FRONT-END ARCHITECT &amp; REACT DEVELOPER</text>
  <rect x="525" y="6" width="9" height="22" fill="#FF0055" class="cursor"/>
</g>

<text x="74" y="295" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#8B949E" letter-spacing="1">
  &gt; Initializing responsive user interfaces, modular design systems, and algorithmic cut-off engines.
</text>

<!-- Bottom HUD Badges Row -->
<g transform="translate(74, 335)">
  <!-- Badge 1: REACT -->
  <g>
    <rect x="0" y="0" width="130" height="36" fill="#0D1626" stroke="#00F0FF" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="18" r="4" fill="#00F0FF"/>
    <text x="28" y="23" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">REACT 18</text>
  </g>
  <!-- Badge 2: JAVASCRIPT -->
  <g transform="translate(145, 0)">
    <rect x="0" y="0" width="170" height="36" fill="#0D1626" stroke="#FFE600" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="18" r="4" fill="#FFE600"/>
    <text x="28" y="23" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">JAVASCRIPT ES6+</text>
  </g>
  <!-- Badge 3: TESTING -->
  <g transform="translate(330, 0)">
    <rect x="0" y="0" width="165" height="36" fill="#0D1626" stroke="#FF0055" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="18" r="4" fill="#FF0055"/>
    <text x="28" y="23" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">JEST &amp; TESTING</text>
  </g>
  <!-- Badge 4: GIT/GITHUB -->
  <g transform="translate(510, 0)">
    <rect x="0" y="0" width="165" height="36" fill="#0D1626" stroke="#00FFCC" stroke-width="1.5" rx="3"/>
    <circle cx="16" cy="18" r="4" fill="#00FFCC"/>
    <text x="28" y="23" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="800" fill="#FFFFFF">GIT / GITHUB</text>
  </g>
</g>

<!-- Right Side Sci-Fi Card: Netrunner Profile Matrix -->
<g transform="translate(830, 95)">
  <polygon points="0,0 300,0 325,25 325,260 295,285 0,285" fill="#0B1322" stroke="#1F3A60" stroke-width="2"/>
  
  <!-- Glowing borders & header -->
  <rect x="0" y="0" width="300" height="32" fill="#00F0FF" fill-opacity="0.15"/>
  <text x="15" y="21" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="900" fill="#00F0FF" letter-spacing="1.5">[ NETRUNNER_ID: @Aahil-J ]</text>
  
  <line x1="0" y1="32" x2="325" y2="32" stroke="#00F0FF" stroke-width="1.5"/>

  <!-- Info lines -->
  <text x="18" y="65" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600" fill="#8B949E">CALLSIGN:</text>
  <text x="110" y="65" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="800" fill="#FFFFFF">AAHIL</text>

  <text x="18" y="95" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600" fill="#8B949E">ROLE:</text>
  <text x="110" y="95" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="800" fill="#00F0FF">FRONT-END DEV</text>

  <text x="18" y="125" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600" fill="#8B949E">SPECIALTY:</text>
  <text x="110" y="125" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="800" fill="#00FFCC">REACT INTERFACES</text>

  <text x="18" y="155" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600" fill="#8B949E">FLAGSHIP:</text>
  <text x="110" y="155" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="800" fill="#FF0055">CAF ENGINE</text>

  <text x="18" y="185" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600" fill="#8B949E">STATUS:</text>
  <text x="110" y="185" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="800" fill="#FFE600">● BUILDING ACTIVELY</text>

  <text x="18" y="215" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600" fill="#8B949E">TIMELINE:</text>
  <text x="110" y="215" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="800" fill="#A5B4FC">SINCE AUG 2026</text>

  <!-- Progress bar in card -->
  <rect x="18" y="240" width="280" height="8" fill="#080C14" stroke="#1F3A60" stroke-width="1" rx="2"/>
  <rect x="18" y="240" width="220" height="8" fill="url(#cyan-pink)" rx="2"/>
  <text x="18" y="265" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#58A6FF">EXPEDITION PROGRESS: 78.5%</text>
</g>

<!-- Animated Tech Radar / Crosshair in Top Right -->
<g class="spin">
  <circle cx="1090" cy="85" r="32" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="1090" cy="85" r="22" fill="none" stroke="#FF0055" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
</g>
<g class="spin-rev">
  <polygon points="1090,60 1095,85 1090,110 1085,85" fill="none" stroke="#00FFCC" stroke-width="1.5" opacity="0.8"/>
  <polygon points="1065,85 1090,90 1115,85 1090,80" fill="none" stroke="#00FFCC" stroke-width="1.5" opacity="0.8"/>
</g>
<circle cx="1090" cy="85" r="4" fill="#00F0FF"/>
</svg>
