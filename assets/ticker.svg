<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img">
<title>Cyber Telemetry Ticker</title>
<style>
@keyframes scroll-left {
  0% { transform: translateX(0); }
  100% { transform: translateX(-1600px); }
}
.marquee {
  animation: scroll-left 25s linear infinite;
  white-space: nowrap;
}
</style>
<defs>
  <linearGradient id="edge-fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#080C14" stop-opacity="1"/>
    <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edge-fade-right" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#080C14" stop-opacity="0"/>
    <stop offset="100%" stop-color="#080C14" stop-opacity="1"/>
  </linearGradient>
</defs>
<rect width="900" height="44" fill="#080C14" stroke="#16233B" stroke-width="1.5" rx="4"/>
<line x1="0" y1="2" x2="900" y2="2" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>
<line x1="0" y1="42" x2="900" y2="42" stroke="#FF0055" stroke-width="1.5" stroke-opacity="0.6"/>

<!-- Left HUD Tag -->
<rect x="6" y="8" width="100" height="28" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1" rx="2"/>
<circle cx="18" cy="22" r="3.5" fill="#00FFCC"/>
<text x="28" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="900" fill="#00F0FF" letter-spacing="1">LIVE_LOG</text>

<!-- Scrolling Marquee Viewport -->
<g transform="translate(120, 0)">
  <clipPath id="ticker-clip">
    <rect x="0" y="0" width="770" height="44"/>
  </clipPath>
  <g clip-path="url(#ticker-clip)">
    <g class="marquee">
      <text x="0" y="27" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="700" fill="#58A6FF" letter-spacing="1">
        &gt;&gt;&gt; <tspan fill="#00F0FF">[SYS_INIT]:</tspan> REACT COMPONENT ENGINE ONLINE &gt;&gt;&gt; <tspan fill="#00FFCC">[DEPLOYED]:</tspan> CAF - COLLEGE AVAILABILITY FINDER READY &gt;&gt;&gt; <tspan fill="#FFE600">[MISSION]:</tspan> SCALABLE FRONT-END ARCHITECTURE &gt;&gt;&gt; <tspan fill="#FF0055">[TESTING]:</tspan> JEST &amp; TESTING-LIBRARY VERIFIED &gt;&gt;&gt; <tspan fill="#00F0FF">[DIRECTIVE]:</tspan> TURNING AMBITIOUS IDEAS INTO EXECUTABLE DIGITAL REALITY &gt;&gt;&gt; <tspan fill="#A5B4FC">[STATUS]:</tspan> CONTINUOUS EXPEDITION &gt;&gt;&gt;
      </text>
      <!-- Duplicate for seamless scroll -->
      <text x="1600" y="27" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="700" fill="#58A6FF" letter-spacing="1">
        &gt;&gt;&gt; <tspan fill="#00F0FF">[SYS_INIT]:</tspan> REACT COMPONENT ENGINE ONLINE &gt;&gt;&gt; <tspan fill="#00FFCC">[DEPLOYED]:</tspan> CAF - COLLEGE AVAILABILITY FINDER READY &gt;&gt;&gt; <tspan fill="#FFE600">[MISSION]:</tspan> SCALABLE FRONT-END ARCHITECTURE &gt;&gt;&gt; <tspan fill="#FF0055">[TESTING]:</tspan> JEST &amp; TESTING-LIBRARY VERIFIED &gt;&gt;&gt; <tspan fill="#00F0FF">[DIRECTIVE]:</tspan> TURNING AMBITIOUS IDEAS INTO EXECUTABLE DIGITAL REALITY &gt;&gt;&gt; <tspan fill="#A5B4FC">[STATUS]:</tspan> CONTINUOUS EXPEDITION &gt;&gt;&gt;
      </text>
    </g>
  </g>
  <!-- Edge Gradients for Smooth In/Out Fading -->
  <rect x="0" y="0" width="40" height="44" fill="url(#edge-fade-left)"/>
  <rect x="730" y="0" width="40" height="44" fill="url(#edge-fade-right)"/>
</g>
</svg>
