<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" role="img">
<title>About System</title>
<style>
@keyframes glow-pulse {
  0%, 100% { filter: drop-shadow(0 0 4px #00F0FF); }
  50% { filter: drop-shadow(0 0 10px #00F0FF); }
}
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.glow { animation: glow-pulse 3s infinite; }
.blinker { animation: blink 1.2s infinite; }
</style>
<defs>
  <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#080C14"/>
    <stop offset="50%" stop-color="#0E1626"/>
    <stop offset="100%" stop-color="#080C14"/>
  </linearGradient>
  <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#00F0FF" fill-opacity="0.12"/>
  </pattern>
</defs>
<rect width="900" height="90" fill="#050810"/>
<rect x="10" y="10" width="880" height="70" fill="url(#bg-grad)" stroke="#162238" stroke-width="1.5" rx="6"/>
<rect x="10" y="10" width="880" height="70" fill="url(#dot-grid)" rx="6"/>

<!-- Tech Corner Brackets -->
<path d="M 10 26 L 10 10 L 26 10" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
<path d="M 890 26 L 890 10 L 874 10" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
<path d="M 10 64 L 10 80 L 26 80" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
<path d="M 890 64 L 890 80 L 874 80" fill="none" stroke="#00F0FF" stroke-width="2.5"/>

<!-- Section Number Badge -->
<polygon points="30,22 45,22 135,22 145,35 145,65 135,68 30,68" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-width="1.5"/>
<text x="87" y="49" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="900" fill="#00F0FF" text-anchor="middle" letter-spacing="1.5">SEC // 01</text>

<!-- Title -->
<text x="165" y="52" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="2">ABOUT_SYSTEM</text>
<text x="165" y="52" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#00F0FF" letter-spacing="2" opacity="0.25" class="glow">ABOUT_SYSTEM</text>
<rect x="420" y="32" width="10" height="24" fill="#FF0055" class="blinker"/>

<!-- Telemetry info right side -->
<text x="850" y="42" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#00FFCC" text-anchor="end">● STATUS: VERIFIED</text>
<text x="850" y="58" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="600" fill="#58A6FF" text-anchor="end">SYS.IDENTITY // CORE_LOGIC</text>

<!-- Bottom neon accent line -->
<line x1="165" y1="68" x2="650" y2="68" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>
<circle cx="654" cy="68" r="3" fill="#FF0055"/>
</svg>
