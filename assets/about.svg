<svg xmlns="http://www.w3.org/2000/svg" width="991" height="340" viewBox="0 0 991 340" role="img">
<title>System Specifications - About Aahil</title>
<style>
@keyframes glow-border {
  0%, 100% { stroke: #00F0FF; filter: drop-shadow(0 0 3px #00F0FF); }
  50% { stroke: #7928CA; filter: drop-shadow(0 0 8px #7928CA); }
}
@keyframes pulse-dot {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; filter: drop-shadow(0 0 6px #00FFCC); }
}
.hud-border { animation: glow-border 4s infinite; }
.pulse-dot { animation: pulse-dot 2s infinite; }
</style>
<defs>
  <pattern id="grid-about" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.08"/>
  </pattern>
  <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0B1322"/>
    <stop offset="100%" stop-color="#080C14"/>
  </linearGradient>
</defs>

<rect width="991" height="340" fill="#050810"/>
<rect x="10" y="10" width="971" height="320" fill="url(#card-grad)" stroke="#16233B" stroke-width="2" rx="6"/>
<rect x="10" y="10" width="971" height="320" fill="url(#grid-about)" rx="6"/>

<!-- Corner Accents -->
<path d="M 10 35 L 10 10 L 35 10" fill="none" stroke="#00F0FF" stroke-width="3"/>
<path d="M 981 35 L 981 10 L 956 10" fill="none" stroke="#00F0FF" stroke-width="3"/>
<path d="M 10 305 L 10 330 L 35 330" fill="none" stroke="#FF0055" stroke-width="3"/>
<path d="M 981 305 L 981 330 L 956 330" fill="none" stroke="#00F0FF" stroke-width="3"/>

<!-- Top Spec Banner -->
<rect x="30" y="24" width="931" height="30" fill="#00F0FF" fill-opacity="0.08" stroke="#00F0FF" stroke-width="1"/>
<text x="45" y="44" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="900" fill="#00F0FF" letter-spacing="1.5">// SYSTEM_SPECIFICATION :: AGENT_PROFILE :: AAHIL-J</text>
<text x="945" y="44" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#00FFCC" text-anchor="end" class="pulse-dot">● SUBSYSTEMS: 100% OPERATIONAL</text>

<!-- Row 1: CORE_MISSION & COGNITIVE_DRIVE -->
<g transform="translate(30, 68)">
  <!-- Card 1 -->
  <rect x="0" y="0" width="455" height="110" fill="#0E1726" stroke="#1F3354" stroke-width="1.5" rx="4"/>
  <rect x="0" y="0" width="160" height="26" fill="#00F0FF" fill-opacity="0.18" rx="4 0 4 0"/>
  <text x="12" y="18" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="900" fill="#00F0FF" letter-spacing="1">[ 01 // CORE_MISSION ]</text>
  <text x="440" y="18" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#00FFCC" text-anchor="end">● ACTIVE</text>
  <text x="16" y="55" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Engineering Web Architectures</text>
  <text x="16" y="80" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="500" fill="#8B949E">
    Developing responsive front-end web apps with React,
  </text>
  <text x="16" y="98" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="500" fill="#8B949E">
    prioritizing clean state logic, speed &amp; intuitive UX.
  </text>

  <!-- Card 2 -->
  <g transform="translate(475, 0)">
    <rect x="0" y="0" width="455" height="110" fill="#0E1726" stroke="#1F3354" stroke-width="1.5" rx="4"/>
    <rect x="0" y="0" width="180" height="26" fill="#7928CA" fill-opacity="0.3" rx="4 0 4 0"/>
    <text x="12" y="18" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="900" fill="#A5B4FC" letter-spacing="1">[ 02 // PROBLEM_SOLVER ]</text>
    <text x="440" y="18" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#A5B4FC" text-anchor="end">● CONTINUOUS</text>
    <text x="16" y="55" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Translating Logic into Code</text>
    <text x="16" y="80" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="500" fill="#8B949E">
      Passionate about algorithmic problem solving,
    </text>
    <text x="16" y="98" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="500" fill="#8B949E">
      turning complex requirements into elegant components.
    </text>
  </g>
</g>

<!-- Row 2: EXPEDITION_GOAL & PHILOSOPHY -->
<g transform="translate(30, 192)">
  <!-- Card 3 -->
  <rect x="0" y="0" width="455" height="118" fill="#0E1726" stroke="#1F3354" stroke-width="1.5" rx="4"/>
  <rect x="0" y="0" width="170" height="26" fill="#FF0055" fill-opacity="0.18" rx="4 0 4 0"/>
  <text x="12" y="18" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="900" fill="#FF0055" letter-spacing="1">[ 03 // MASTER_DIRECTIVE ]</text>
  <text x="440" y="18" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#FF0055" text-anchor="end">● TARGET</text>
  <text x="16" y="55" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Project-Driven Software Mastery</text>
  <text x="16" y="80" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="500" fill="#8B949E">
    Mastering modern web ecosystems by shipping production-grade
  </text>
  <text x="16" y="98" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="500" fill="#8B949E">
    projects, adhering to automated testing &amp; best practices.
  </text>

  <!-- Card 4: Operating Philosophy Quote -->
  <g transform="translate(475, 0)">
    <rect x="0" y="0" width="455" height="118" fill="#0E1726" stroke="#00FFCC" stroke-width="1.5" rx="4"/>
    <rect x="0" y="0" width="190" height="26" fill="#00FFCC" fill-opacity="0.18" rx="4 0 4 0"/>
    <text x="12" y="18" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="900" fill="#00FFCC" letter-spacing="1">[ 04 // OPERATING_MAXIM ]</text>
    <text x="440" y="18" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#00FFCC" text-anchor="end">● CODED</text>
    <text x="16" y="58" font-family="'Orbitron', 'Rajdhani', sans-serif" font-size="15" font-weight="800" fill="#00F0FF" letter-spacing="0.5">
      “Small daily increments compound into
    </text>
    <text x="16" y="80" font-family="'Orbitron', 'Rajdhani', sans-serif" font-size="15" font-weight="800" fill="#00F0FF" letter-spacing="0.5">
      monumental engineering breakthroughs.”
    </text>
    <text x="16" y="104" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#58A6FF">
      // PROTOCOL: NEVER_STOP_BUILDING
    </text>
  </g>
</g>
</svg>
